<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Airport Rush</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#08111f;
font-family:Arial,sans-serif;
touch-action:none;
}

#game{
width:100%;
height:100%;
position:relative;
overflow:hidden;
background:#263544;
}


/* =========================
MENU
========================= */

#menu{
position:absolute;
inset:0;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;

color:white;

z-index:50;

background:linear-gradient(
to bottom,
#10243b 0%,
#1c3a52 55%,
#283946 100%
);
}

.logo{
font-size:48px;
font-weight:900;
letter-spacing:3px;
color:#ffd95a;
text-shadow:0 5px 0 #9b7010;
margin-bottom:8px;
}

.subtitle{
font-size:16px;
color:#d9e5f5;
letter-spacing:4px;
margin-bottom:55px;
}

.play-button{
border:none;
background:#ff5c5c;
color:white;
font-size:28px;
font-weight:bold;
padding:18px 55px;
border-radius:18px;
box-shadow:0 7px 0 #a72d2d;
}

.play-button:active{
transform:translateY(5px);
box-shadow:0 2px 0 #a72d2d;
}

.instructions{
margin-top:35px;
color:#b9c8d8;
font-size:14px;
line-height:1.5;
}


/* =========================
GAME
========================= */

#gameScreen{
position:absolute;
inset:0;
display:none;
}


/* =========================
AIRPORT
========================= */

#airport{
position:absolute;
left:7%;
right:7%;
top:0;
bottom:0;

overflow:hidden;

background:#303944;

border-left:5px solid #202832;
border-right:5px solid #202832;
}

#sky{
position:absolute;
top:0;
left:0;
right:0;
height:34%;

background:linear-gradient(
to bottom,
#65b6eb,
#d5edf8
);
}

.window{
position:absolute;
top:0;
height:38%;
width:5px;
background:rgba(255,255,255,.65);
z-index:2;
}

.w1{left:20%}
.w2{left:40%}
.w3{left:60%}
.w4{left:80%}

#outsideGround{
position:absolute;
top:32%;
left:0;
right:0;
height:5%;
background:#777f85;
}

#runway{
position:absolute;
top:36%;
left:0;
right:0;
height:5%;
background:#30363d;
}

.runwayLine{
position:absolute;
top:50%;
width:65px;
height:4px;
background:#eee;
}

.r1{left:5%}
.r2{left:28%}
.r3{left:51%}
.r4{left:74%}


/* =========================
TORRE
========================= */

#tower{
position:absolute;
top:11%;
right:7%;

width:38px;
height:95px;

background:#66727d;

z-index:1;
}

#tower:before{
content:"";

position:absolute;

left:-8px;
top:-20px;

width:54px;
height:27px;

background:#46515b;

border-radius:5px;
}

#tower:after{
content:"";

position:absolute;

left:16px;
top:-37px;

width:5px;
height:18px;

background:#303943;
}


/* =========================
AVIONES
========================= */

.plane{
position:absolute;

z-index:1;

font-size:48px;

opacity:.9;
}

.plane1{
top:12%;
left:-80px;

animation:
fly1 18s linear infinite;
}

.plane2{
top:22%;
right:-80px;

font-size:38px;

animation:
fly2 25s linear infinite;
}

@keyframes fly1{

from{
transform:translateX(0);
}

to{
transform:translateX(650px);
}

}

@keyframes fly2{

from{
transform:translateX(0);
}

to{
transform:translateX(-650px);
}

}


/* =========================
GATE
========================= */

#gate{
position:absolute;

top:28%;
left:50%;

transform:translateX(-50%);

background:#075985;

color:white;

border:3px solid white;

border-radius:6px;

padding:6px 15px;

font-size:14px;

font-weight:bold;

z-index:3;
}


/* =========================
CARRILES
========================= */

#runArea{
position:absolute;

top:40%;
left:0;
right:0;
bottom:0;

background:#303944;
}

.lane{
position:absolute;

top:0;
bottom:0;

width:3px;

background:
repeating-linear-gradient(
to bottom,
rgba(230,235,240,.8) 0px,
rgba(230,235,240,.8) 45px,
transparent 45px,
transparent 90px
);
}

.lane1{
left:33.333%;
}

.lane2{
left:66.666%;
}


/* =========================
HUD
========================= */

#hud{
position:absolute;

top:18px;
left:18px;
right:18px;

display:flex;
justify-content:space-between;

z-index:20;

color:white;

font-size:18px;

font-weight:bold;
}

.hudBox{
background:rgba(0,0,0,.42);

padding:9px 13px;

border-radius:12px;
}

#level{
position:absolute;

top:68px;
left:50%;

transform:translateX(-50%);

z-index:20;

color:#ffe36b;

background:rgba(0,0,0,.38);

padding:5px 11px;

border-radius:10px;

font-size:12px;

font-weight:bold;
}


/* =========================
PLAYER
========================= */

#player{
position:absolute;

width:62px;
height:82px;

bottom:92px;

z-index:10;

transition:left .10s ease;
}

.head{
position:absolute;

width:42px;
height:42px;

left:10px;
top:0;

background:#f2b58c;

border-radius:45%;

border:3px solid #542f26;
}

.hair{
position:absolute;

width:42px;
height:18px;

left:10px;
top:0;

background:#34251e;

border-radius:50% 50% 25% 25%;

z-index:2;
}

.eye{
position:absolute;

width:5px;
height:7px;

background:#202020;

border-radius:50%;

top:19px;

z-index:3;
}

.eye.left{
left:20px;
}

.eye.right{
right:20px;
}

.body{
position:absolute;

width:48px;
height:43px;

left:7px;
top:37px;

background:#3478d4;

border-radius:12px 12px 8px 8px;

border:3px solid #1c4175;
}

.backpack{
position:absolute;

width:15px;
height:30px;

left:0;
top:44px;

background:#e85c4a;

border-radius:6px;
}

.leg{
position:absolute;

width:12px;
height:25px;

background:#202c3b;

top:75px;

border-radius:5px;
}

.leg.left{
left:15px;
}

.leg.right{
right:15px;
}

.running .leg.left{
animation:
run1 .18s infinite alternate;
}

.running .leg.right{
animation:
run2 .18s infinite alternate;
}

@keyframes run1{

from{
transform:rotate(20deg);
}

to{
transform:rotate(-20deg);
}

}

@keyframes run2{

from{
transform:rotate(-20deg);
}

to{
transform:rotate(20deg);
}

}


/* =========================
MALETAS
========================= */

.suitcase{
position:absolute;

width:42px;
height:52px;

background:#ffbd32;

border:4px solid #8c6414;

border-radius:8px;

z-index:8;
}

.suitcase:before{
content:"";

position:absolute;

width:15px;
height:8px;

left:10px;
top:-11px;

border:4px solid #8c6414;

border-bottom:none;

border-radius:8px 8px 0 0;
}


/* =========================
MONEDAS
========================= */

.coin{
position:absolute;

width:30px;
height:30px;

border-radius:50%;

background:#ffd83d;

border:4px solid #b88708;

z-index:7;

display:flex;

justify-content:center;

align-items:center;

color:#8c6414;

font-weight:bold;

box-shadow:
0 0 10px rgba(255,215,50,.7);
}

.ticket{
position:absolute;

width:42px;
height:28px;

background:#f5f5f5;

border:3px solid #2772a8;

border-radius:5px;

z-index:7;

display:flex;

justify-content:center;

align-items:center;
}


/* =========================
RECOMPENSA
========================= */

.reward{
position:absolute;

left:50%;
top:45%;

transform:translate(-50%,-50%);

z-index:40;

color:#ffe25a;

font-size:25px;

font-weight:900;

text-shadow:0 3px 0 #6d5310;

animation:
reward .8s forwards;

pointer-events:none;
}

@keyframes reward{

0%{
opacity:0;
transform:
translate(-50%,-20%)
scale(.5);
}

25%{
opacity:1;
transform:
translate(-50%,-50%)
scale(1.15);
}

100%{
opacity:0;
transform:
translate(-50%,-90%)
scale(1);
}

}


/* =========================
CONTROLES
========================= */

#controls{
position:absolute;

bottom:25px;

left:0;
right:0;

display:flex;

justify-content:space-around;

padding:0 45px;

z-index:30;
}

.control{
width:72px;
height:72px;

border:none;

border-radius:50%;

background:rgba(255,255,255,.20);

color:white;

font-size:30px;

font-weight:bold;

border:
2px solid rgba(255,255,255,.45);
}

.control:active{
background:rgba(255,255,255,.42);

transform:scale(.95);
}


/* =========================
GAME OVER
========================= */

#gameOver{
position:absolute;

inset:0;

display:none;

align-items:center;

justify-content:center;

flex-direction:column;

background:
rgba(4,10,20,.86);

color:white;

z-index:100;

text-align:center;
}

#gameOver h2{
font-size:43px;

color:#ff6464;

margin-bottom:15px;
}

#finalScore{
font-size:22px;

margin-bottom:10px;
}

#finalCoins{
font-size:20px;

color:#ffd83d;

margin-bottom:30px;
}

.restart{
border:none;

background:#ffd34f;

color:#382800;

font-size:21px;

font-weight:bold;

padding:15px 35px;

border-radius:15px;
}

</style>
</head>


<body>

<div id="game">


<!-- MENU -->

<div id="menu">

<div class="logo">
AIRPORT RUSH
</div>

<div class="subtitle">
RUN • DODGE • ESCAPE
</div>

<button
class="play-button"
onclick="startGame()"
>
✈ JUGAR
</button>

<div class="instructions">
Esquiva las maletas y recoge monedas.<br>
¡Intenta llegar lo más lejos posible!
</div>

</div>


<!-- GAME -->

<div id="gameScreen">


<div id="hud">

<div class="hudBox">
🏆 <span id="score">0</span>
</div>

<div class="hudBox">
🪙 <span id="coins">0</span>
</div>

</div>


<div id="level">
NIVEL 1 • x1.0
</div>


<div id="airport">


<div id="sky"></div>

<div class="window w1"></div>
<div class="window w2"></div>
<div class="window w3"></div>
<div class="window w4"></div>


<div id="outsideGround"></div>


<div id="runway">

<div class="runwayLine r1"></div>
<div class="runwayLine r2"></div>
<div class="runwayLine r3"></div>
<div class="runwayLine r4"></div>

</div>


<div id="tower"></div>


<div class="plane plane1">
✈️
</div>

<div class="plane plane2">
✈️
</div>


<div id="gate">
GATE 12
</div>


<div id="runArea">

<div class="lane lane1"></div>
<div class="lane lane2"></div>

</div>


<!-- PLAYER -->

<div id="player"
class="running">

<div class="hair"></div>

<div class="head">

<div class="eye left"></div>
<div class="eye right"></div>

</div>

<div class="backpack"></div>

<div class="body"></div>

<div class="leg left"></div>
<div class="leg right"></div>

</div>


<!-- CONTROLS -->

<div id="controls">

<button
class="control"
id="leftButton"
>
◀
</button>

<button
class="control"
id="rightButton"
>
▶
</button>

</div>

</div>


<!-- GAME OVER -->

<div id="gameOver">

<h2>
¡TARJETA ROJA!
</h2>

<div id="finalScore">
Puntuación: 0
</div>

<div id="finalCoins">
🪙 Monedas: 0
</div>

<button
class="restart"
onclick="restartGame()"
>
VOLVER A JUGAR
</button>

</div>


</div>

</div>


<script>

/* =====================================================
VARIABLES
===================================================== */

let player;

let gameRunning=false;

let playerLane=1;

let score=0;

let coins=0;

let level=1;


/*
Velocidad inicial.

Un poco más rápida que antes.
*/

let obstacleSpeed=5.2;


/*
Tiempo entre oleadas.

Ahora es bastante menor.
*/

let spawnDelay=1050;


/*
Temporizadores.
*/

let spawnTimer=null;

let difficultyTimer=null;

let scoreTimer=null;


/*
Récord.
*/

let highScore=
Number(
localStorage.getItem(
"airport_high_score"
)||0
);


/*
Control de oleada.

Cada oleada puede tener
1 o 2 maletas.

Nunca 3.
*/

let currentWave=[];


/* =====================================================
CARGA
===================================================== */

window.addEventListener(
"load",
function(){

player=
document.getElementById(
"player"
);

}
);


/* =====================================================
START
===================================================== */

function startGame(){

document
.getElementById("menu")
.style.display="none";

document
.getElementById("gameScreen")
.style.display="block";

document
.getElementById("gameOver")
.style.display="none";


/*
Limpiar objetos.
*/

document
.querySelectorAll(
".suitcase,.coin,.ticket,.reward"
)
.forEach(
el=>el.remove()
);


/*
Valores iniciales.
*/

score=0;

coins=0;

level=1;

playerLane=1;

obstacleSpeed=5.2;

spawnDelay=1050;

currentWave=[];


/*
Limpiar timers.
*/

clearTimeout(spawnTimer);

clearInterval(difficultyTimer);

clearInterval(scoreTimer);


/*
HUD.
*/

updateHUD();

updateLevel();

positionPlayer();


gameRunning=true;

player.classList.add(
"running"
);


/*
Primera oleada.
*/

scheduleWave();


startDifficulty();

startScore();

}


/* =====================================================
POSICIÓN
===================================================== */

function positionPlayer(){

const area=
document.getElementById(
"runArea"
);

const laneWidth=
area.clientWidth/3;


/*
Exactamente el centro
del carril.
*/

const x=
laneWidth*playerLane+
laneWidth/2-
31;


player.style.left=
x+"px";

}


/* =====================================================
MOVIMIENTO
===================================================== */

function moveLeft(){

if(!gameRunning)return;

if(playerLane>0){

playerLane--;

positionPlayer();

}

}


function moveRight(){

if(!gameRunning)return;

if(playerLane<2){

playerLane++;

positionPlayer();

}

}


/* =====================================================
TECLADO
===================================================== */

document.addEventListener(
"keydown",
function(e){

if(e.key==="ArrowLeft"){
moveLeft();
}

if(e.key==="ArrowRight"){
moveRight();
}

}
);


/* =====================================================
MÓVIL
===================================================== */

document
.getElementById("leftButton")
.addEventListener(
"touchstart",
function(e){

e.preventDefault();

moveLeft();

}
);

document
.getElementById("rightButton")
.addEventListener(
"touchstart",
function(e){

e.preventDefault();

moveRight();

}
);


/* =====================================================
PROGRAMAR OLEADA
===================================================== */

function scheduleWave(){

if(!gameRunning)return;


/*
Si ya hay una oleada
en curso, esperamos.
*/

if(currentWave.length>0){

return;

}


clearTimeout(
spawnTimer
);


spawnTimer=
setTimeout(
function(){

createWave();

},
spawnDelay
);

}


/* =====================================================
CREAR OLEADA
===================================================== */

function createWave(){

if(!gameRunning)return;


/*
Solo una oleada a la vez.
*/

if(currentWave.length>0){

return;

}


const area=
document.getElementById(
"runArea"
);


/*
1 o 2 maletas.

Nunca 3.
*/

let count;


const twoChance=
Math.min(
0.65,
0.25+
(level-1)*0.06
);


if(
Math.random()<twoChance
){

count=2;

}else{

count=1;

}


/*
Mezclamos los carriles.
*/

let lanes=[
0,
1,
2
];

lanes.sort(
()=>Math.random()-0.5
);


/*
Carriles ocupados.
*/

for(
let i=0;
i<count;
i++
){

createObstacle(
area,
lanes[i]
);

}


/*
Carril libre.

Puede contener moneda.
*/

const freeLane=
lanes[count];


if(
Math.random()<0.70
){

spawnCollectible(
area,
freeLane
);

}

}


/* =====================================================
CREAR MALETA
===================================================== */

function createObstacle(
area,
lane
){

const obstacle=
document.createElement(
"div"
);


obstacle.className=
"suitcase";


/*
Misma geometría que
el personaje.
*/

const laneWidth=
area.clientWidth/3;


const x=
laneWidth*lane+
laneWidth/2-
21;


obstacle.style.left=
x+"px";


/*
Empiezan bastante arriba.
*/

let y=-110;


obstacle.style.top=
y+"px";


area.appendChild(
obstacle
);


/*
Guardar oleada.
*/

currentWave.push(
obstacle
);


function animate(){

if(!gameRunning){

removeObstacle(
obstacle
);

return;

}


/*
Movimiento.
*/

y+=obstacleSpeed;

obstacle.style.top=
y+"px";


/*
COLISIÓN
*/

const p=
player.getBoundingClientRect();

const o=
obstacle.getBoundingClientRect();


if(
p.left<o.right &&
p.right>o.left &&
p.top<o.bottom &&
p.bottom>o.top
){

endGame();

return;

}


/*
Cuando sale de pantalla.
*/

if(
y<
area.clientHeight+120
){

requestAnimationFrame(
animate
);

}else{

removeObstacle(
obstacle
);

}

}


requestAnimationFrame(
animate
);

}


/* =====================================================
ELIMINAR MALETA
===================================================== */

function removeObstacle(
obstacle
){

const index=
currentWave.indexOf(
obstacle
);


if(index!==-1){

currentWave.splice(
index,
1
);

}


if(
obstacle.parentNode
){

obstacle.remove();

}


/*
Cuando se ha despejado
la oleada, programamos
la siguiente.
*/

if(
currentWave.length===0 &&
gameRunning
){

scheduleWave();

}

}


/* =====================================================
COLECCIONABLES
===================================================== */

function spawnCollectible(
area,
lane
){

const ticket=
Math.random()<0.18;


const item=
document.createElement(
"div"
);


if(ticket){

item.className="ticket";

item.textContent="🎟️";

}else{

item.className="coin";

item.textContent="€";

}


const laneWidth=
area.clientWidth/3;


const size=
ticket?42:30;


const x=
laneWidth*lane+
laneWidth/2-
size/2;


item.style.left=
x+"px";


let y=-80;


item.style.top=
y+"px";


area.appendChild(
item
);


function animate(){

if(!gameRunning){

item.remove();

return;

}


y+=
obstacleSpeed*.9;


item.style.top=
y+"px";


const p=
player.getBoundingClientRect();

const i=
item.getBoundingClientRect();


if(
p.left<i.right &&
p.right>i.left &&
p.top<i.bottom &&
p.bottom>i.top
){

collectItem(
item,
ticket
);

return;

}


if(
y<
area.clientHeight+100
){

requestAnimationFrame(
animate
);

}else{

item.remove();

}

}


requestAnimationFrame(
animate
);

}


/* =====================================================
RECOGER
===================================================== */

function collectItem(
item,
ticket
){

if(!gameRunning)return;


if(ticket){

coins+=5;

score+=250;

showReward(
"🎟️ +5 MONEDAS"
);

}else{

coins++;

score+=100;

showReward(
"🪙 +1"
);

}


item.remove();

updateHUD();

}


/* =====================================================
RECOMPENSA
===================================================== */

function showReward(
text
){

const reward=
document.createElement(
"div"
);


reward.className=
"reward";


reward.textContent=
text;


document
.getElementById(
"gameScreen"
)
.appendChild(
reward
);


setTimeout(
function(){

reward.remove();

},
800
);

}


/* =====================================================
PUNTUACIÓN
===================================================== */

function startScore(){

clearInterval(
scoreTimer
);


scoreTimer=
setInterval(
function(){

if(!gameRunning)return;

score++;

updateHUD();

},
1000
);

}


/* =====================================================
DIFICULTAD
===================================================== */

function startDifficulty(){

clearInterval(
difficultyTimer
);


/*
Cada 25 segundos
sube un nivel.
*/

difficultyTimer=
setInterval(
function(){

if(!gameRunning)return;


level++;


/*
VELOCIDAD

Nivel 1 = 5.2
Nivel 2 = 5.5
Nivel 3 = 5.8
Nivel 4 = 6.1
etc.
*/

obstacleSpeed=
Math.min(
8.5,
5.2+
(level-1)*0.30
);


/*
FRECUENCIA

Nivel 1 = 1.05 s
Nivel 2 = 0.95 s
Nivel 3 = 0.85 s
Nivel 4 = 0.75 s
Nivel 5+ = 0.65 s
*/

spawnDelay=
Math.max(
650,
1050-
(level-1)*100
);


updateLevel();


score+=100;


showReward(
"🔥 NIVEL "+level
);


updateHUD();


},
25000
);

}


/* =====================================================
HUD
===================================================== */

function updateHUD(){

document
.getElementById("score")
.textContent=
score;


document
.getElementById("coins")
.textContent=
coins;

}


function updateLevel(){

document
.getElementById("level")
.textContent=
"NIVEL "+
level+
" • x"+
(
obstacleSpeed/5.2
).toFixed(1);

}


/* =====================================================
GAME OVER
===================================================== */

function endGame(){

if(!gameRunning)return;


gameRunning=false;


clearTimeout(
spawnTimer
);

clearInterval(
difficultyTimer
);

clearInterval(
scoreTimer
);


player.classList.remove(
"running"
);


/*
Récord.
*/

if(
score>highScore
){

highScore=
score;


localStorage.setItem(
"airport_high_score",
highScore
);

}


/*
Resultado.
*/

document
.getElementById(
"finalScore"
)
.textContent=
"Puntuación: "+
score+
" • Récord: "+
highScore;


document
.getElementById(
"finalCoins"
)
.textContent=
"🪙 Monedas: "+
coins;


document
.getElementById(
"gameOver"
)
.style.display=
"flex";

}


/* =====================================================
RESTART
===================================================== */

function restartGame(){

document
.querySelectorAll(
".suitcase,.coin,.ticket,.reward"
)
.forEach(
el=>el.remove()
);


clearTimeout(
spawnTimer
);

clearInterval(
difficultyTimer
);

clearInterval(
scoreTimer
);


currentWave=[];


startGame();

}


/* =====================================================
RESIZE
===================================================== */

window.addEventListener(
"resize",
function(){

if(gameRunning){

positionPlayer();

}

});

</script>

</body>
</html>
